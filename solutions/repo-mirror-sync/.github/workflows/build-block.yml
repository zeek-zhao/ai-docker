# .github/workflows/build-block.yml — 块镜像构建流水线（FR-B1~B4，阶段 3）
# 目标环境：Linux（仓库相对路径；仓库根 AGENT.md）。
# 供 plan 结果驱动按块调用（workflow_call，可复用）。
name: build-block

on:
  workflow_call:
    inputs:
      block_id:
        description: "块 id（config/policy.yaml blocks[].id）"
        required: true
        type: string

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: solutions/repo-mirror-sync

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 块镜像构建（L0 基座，索引不进继承链 FR-B2）
        run: >
          docker build
          -f docker/block.Dockerfile
          --build-arg BUILD_BLOCK=${{ inputs.block_id }}
          --build-arg BLOCK_VERSION=${{ github.run_number }}
          -t block-${{ inputs.block_id }}:${{ github.run_number }} .

      - name: 绑定表检查（FR-B3）
        run: test -f out/bindings/${{ inputs.block_id }}/bindings.json

      - name: 导出镜像层
        run: docker save block-${{ inputs.block_id }}:${{ github.run_number }} -o out/block.tar

      - name: 全层加密（FR-B4，age）与 sha256 tag 规范
        env:
          AGE_RECIPIENTS: ${{ secrets.AGE_RECIPIENTS }}
        run: >
          age -encrypt -r "$AGE_RECIPIENTS"
          -o out/block.tar.age out/block.tar
          && sha256sum out/block.tar
        # tag 规范（FR-B4 / docs/01 §12.2）：对外 tag 一律取
        # 明文层 sha256 摘要，禁止 latest（AGENTS §3.3 策略唯一出处）。
