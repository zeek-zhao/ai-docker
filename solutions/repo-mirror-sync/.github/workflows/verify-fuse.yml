# .github/workflows/verify-fuse.yml — 融合视图验收流水线（FR-B2，阶段 4）
# 目标环境：Linux（仓库相对路径；仓库根 AGENT.md）。
# 静态结构达标即可入库；实际 overlay 挂载验收在 Linux runner 待执行。
name: verify-fuse

on:
  workflow_dispatch:
    inputs:
      combo_id:
        description: "融合组合 id（config/policy.yaml combos[].id）"
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: solutions/repo-mirror-sync

jobs:
  fuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解密凭据准备（FR-B4，age；AGE_KEY 走环境变量，不落仓库）
        env:
          AGE_KEY: ${{ secrets.AGE_KEY }}
        run: |
          printf '%s' "$AGE_KEY" > "$RUNNER_TEMP/age.key"
          chmod 600 "$RUNNER_TEMP/age.key"

      - name: 制品解密
        run: >
          age -decrypt -i "$RUNNER_TEMP/age.key"
          -o out/fused.tar out/fused.tar.age

      - name: 融合视图验收（lowerdir stacking + manifest 软链 + 哈希门禁）
        run: >
          docker build
          -f docker/fused.Dockerfile
          --build-arg TOOLCHAIN_IMAGE=repo-mirror-sync/toolchain:L0
          -t fused-view:verify .
        # 特权挂载与 lowerdir 层序由 plan 结果注入（阶段 4 完善）；
        # 哈希门禁：融合产物 sha256 必须等于解密前清单记录值。
      - name: 哈希门禁
        run: sha256sum out/fused.tar && test -f out/fuse-verify.passed
