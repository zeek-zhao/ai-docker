- id: agent-default-model # magpie
  config:
    provider: magpie
    model: zeek/zhipu/glm-5.3-flash
- id: web-search-deepseek # magpie
  name: "@deepseek-ai/dsh-web-search-deepseek"
  config:
    apiKeyEnv: MAGPIE_GATEWAY_KEY
    # magpie: points at magpie's local gateway; Disconnect in magpie or `magpie uninstall` undoes it, or remove this entry and pick another model
    baseURL: "http://127.0.0.1:3425/v1"
    model: "zeek/zhipu/glm-5.3-flash"
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: standard
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    usage: detailed
    developerTools: true
    purpose: null
    process: standard
    completion: api-key
- id: session-log-deepseek
  name: "@deepseek-ai/dsh-session-log-deepseek"
  config:
    enabled: false
- id: plugin-market
  name: "@deepseek-ai/dsh-plugin-market"
  config:
    indexes:
      - https://dshopen.org/index.json
- insert:
    # magpie
    - id: magpie-mcp-magpie
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: "magpie"
        transport: "streamable-http"
        url: "http://127.0.0.1:3425/mcp/magpie/hub/dsh"
- id: genui
  disabled: false
- id: image-gen
  disabled: false
- id: dsh-at-file
  disabled: false
- id: skills-manager
  disabled: true

