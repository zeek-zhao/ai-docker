# config/homepage/services.yaml —— HomePage 服务清单（仅本容器对外服务入口，PLAN §13.1）
- 开发容器:
    icon: mdi-docker
    items:
      - Web 终端:
          icon: mdi-console
          href: /term/
          description: ttyd 终端（dev 用户会话）
      - 文件共享:
          icon: mdi-folder-multiple-outline
          href: /file-share/
          description: devbox 数据目录浏览/上传/删除
      - DSH 远程桌面:
          icon: mdi-monitor
          href: /dsh/
          description: 需 ENABLE_DSH=1 并注入二进制后可用
      - Magpie 面板:
          icon: mdi-robot
          href: /magpie/
          description: 需 ENABLE_MAGPIE=1 并注入二进制后可用
