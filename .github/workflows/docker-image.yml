# .github/workflows/docker-image.yml —— devbox CI 构建推送（CD-001 配套）
# 文档编号：WF-001 · 版本：v1.0 · 2026-11-28 · 维护人：zeek.zhao
# 触发：ai-devbox / main push 或手动；tag：Asia/Shanghai 时区 YYYYMMDD-HHmm + latest 指向最新
name: docker-image

on:
  push:
    branches: [ai-devbox, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 等效 scripts/build.sh 的 CA 兜底：公网标准环境无宿主私有 CA，
      # 空目录 + .gitkeep 使 Dockerfile 的 COPY .buildctx/ca/ 等效 no-op。
      - name: Prepare build context (CA placeholder)
        run: mkdir -p solutions/devbox/.buildctx/ca && touch solutions/devbox/.buildctx/ca/.gitkeep

      - name: Generate timestamp tag (Asia/Shanghai)
        id: ts
        run: echo "tag=$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: solutions/devbox
          file: solutions/devbox/Dockerfile
          target: final
          push: true
          tags: |
            ghcr.io/zeek-zhao/devbox:${{ steps.ts.outputs.tag }}
            ghcr.io/zeek-zhao/devbox:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
